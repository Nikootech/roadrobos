<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="RoadRobos – Book vehicle services, track technicians, and manage deliveries with ease.">
  <meta name="keywords" content="vehicle service, road assistance, technician booking, delivery tracking">
  <meta name="theme-color" content="#1B8A5A">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="RoadRobos">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>RoadRobos</title>

  <style>
    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #FFFFFF;
      overflow: hidden;
    }

    /* Force-hide Flutter's native blue <progress> element at all times */
    progress {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      height: 0 !important;
      width: 0 !important;
      position: absolute !important;
      top: -9999px !important;
      pointer-events: none !important;
    }

    /* ── RoadRobos Green Loading Bar ── */
    #rr-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background-color: rgba(0, 98, 65, 0.08);
      z-index: 2147483647;
      overflow: hidden;
    }

    #rr-loader-fill {
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg, #006241, #1B8A5A, #34D399, #10B981, #006241);
      border-radius: 0 3px 3px 0;
      animation: rrSlide 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      box-shadow: 0 0 10px rgba(52, 211, 153, 0.5);
    }

    @keyframes rrSlide {
      0%   { transform: translateX(-120%); }
      100% { transform: translateX(350%); }
    }

    /* ── Splash Screen & Seamless Transparent Breathing Logo Stage ── */
    #splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #FFFFFF !important;
      background-color: #FFFFFF !important;
      z-index: 9999;
      user-select: none;
      -webkit-user-select: none;
      transition: opacity 0.4s ease-out;
    }

    .rr-stage-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Expanding Pulse Rings around Logo */
    .rr-pulse-container {
      position: absolute;
      top: 90px;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 200px;
      height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 1;
    }

    .rr-pulse-ring {
      position: absolute;
      border-radius: 50%;
      border: 1.5px solid rgba(27, 138, 90, 0.18);
      animation: rrPulseExpand 2.8s cubic-bezier(0.16, 1, 0.3, 1) infinite;
    }

    .rr-pulse-ring:nth-child(2) {
      animation-delay: 0.9s;
      border-color: rgba(52, 211, 153, 0.22);
    }

    .rr-pulse-ring:nth-child(3) {
      animation-delay: 1.8s;
      border-color: rgba(16, 185, 129, 0.14);
    }

    .rr-ambient-glow {
      position: absolute;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(27, 138, 90, 0.1) 0%, rgba(52, 211, 153, 0.04) 50%, transparent 75%);
      filter: blur(20px);
    }

    /* Seamless Transparent Logo Container */
    .rr-logo-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      z-index: 2;
    }

    /* ONLY LOGO ANIMATES - Smooth Organic Breath */
    .rr-logo-img {
      max-width: 180px;
      max-height: 180px;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
      background: transparent;
      animation: rrLogoBreathe 2.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      transform-origin: center center;
    }

    /* Sub-indicator & Live Dots */
    .rr-status-area {
      margin-top: 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      z-index: 2;
    }

    .rr-spin-ring {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2.5px solid rgba(27, 138, 90, 0.15);
      border-top-color: #006241;
      border-right-color: #1B8A5A;
      animation: rrSpin 0.9s cubic-bezier(0.5, 0.1, 0.5, 0.9) infinite;
    }

    .rr-status-label {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2.2px;
      text-transform: uppercase;
      color: #006241;
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .rr-dots span {
      display: inline-block;
      animation: rrDotFade 1.4s infinite;
    }

    .rr-dots span:nth-child(2) { animation-delay: 0.2s; }
    .rr-dots span:nth-child(3) { animation-delay: 0.4s; }

    /* LOGO BREATHING KEYFRAMES */
    @keyframes rrLogoBreathe {
      0% {
        transform: scale(0.96);
        filter: drop-shadow(0 2px 5px rgba(0, 98, 65, 0.05));
      }
      50% {
        transform: scale(1.08);
        filter: drop-shadow(0 8px 18px rgba(27, 138, 90, 0.2));
      }
      100% {
        transform: scale(0.96);
        filter: drop-shadow(0 2px 5px rgba(0, 98, 65, 0.05));
      }
    }

    @keyframes rrPulseExpand {
      0% {
        width: 140px;
        height: 140px;
        opacity: 0.85;
        transform: scale(0.9);
      }
      100% {
        width: 320px;
        height: 320px;
        opacity: 0;
        transform: scale(1.35);
      }
    }

    @keyframes rrSpin {
      to { transform: rotate(360deg); }
    }

    @keyframes rrDotFade {
      0%, 20% { opacity: 0; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(-2px); }
      100% { opacity: 0; transform: translateY(0); }
    }

    ::selection {
      background-color: rgba(27, 138, 90, 0.2);
    }
  </style>

  <!-- Flutter bootstrap -->
  <script src="flutter_bootstrap.js" async=""></script>

  <script>
    // MutationObserver: intercept and destroy any <progress> element Flutter injects
    (function () {
      function killProgress(node) {
        if (!node) return;
        if (node.nodeName === 'PROGRESS') {
          node.style.cssText = [
            'display:none!important',
            'visibility:hidden!important',
            'opacity:0!important',
            'height:0!important',
            'width:0!important',
            'position:absolute!important',
            'top:-9999px!important',
            'pointer-events:none!important'
          ].join(';');
        }
        if (node.querySelectorAll) {
          node.querySelectorAll('progress').forEach(killProgress);
        }
      }

      var observer = new MutationObserver(function (mutations) {
        mutations.forEach(function (m) {
          m.addedNodes.forEach(killProgress);
        });
      });

      observer.observe(document.documentElement, { childList: true, subtree: true });

      function cleanUp() {
        observer.disconnect();
        clearInterval(checkTimer);
        var loader = document.getElementById('rr-loader');
        if (loader) loader.remove();
        removeSplashFromWeb();
      }

      // Clean up after Flutter finishes loading
      window.addEventListener('flutter-initialized', cleanUp);
      window.addEventListener('flutter-first-frame', cleanUp);

      // Check for Flutter elements periodically as a fail-safe
      var checkTimer = setInterval(function() {
        if (document.querySelector('flt-glass-pane') || document.querySelector('flutter-view')) {
          cleanUp();
        }
      }, 100);
    })();

    // Called by Flutter's splash removal mechanism
    function removeSplashFromWeb() {
      var el;
      el = document.getElementById('splash');         if (el) el.remove();
      el = document.getElementById('splash-branding'); if (el) el.remove();
      el = document.getElementById('rr-loader');       if (el) el.remove();
      document.body.style.background = 'transparent';
    }
  </script>

  <!-- Razorpay Web SDK integration -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script>
    window.payWithRazorpayWeb = function(options, onSuccess, onFailure) {
      options.handler = function(response) {
        onSuccess(response.razorpay_payment_id, response.razorpay_order_id, response.razorpay_signature);
      };
      options.modal = {
        ondismiss: function() {
          onFailure("Payment cancelled by user");
        }
      };
      try {
        var rzp = new Razorpay(options);
        rzp.open();
      } catch (e) {
        onFailure(e.message || "Failed to initialize Razorpay checkout popup");
      }
    };
  </script>
</head>
<body>

  <!-- RoadRobos branded green loading bar -->
  <div id="rr-loader">
    <div id="rr-loader-fill"></div>
  </div>

  <!-- Splash stage with breathing logo & expanding pulse halo -->
  <div id="splash">
    <div class="rr-stage-wrapper">
      <!-- Expanding Pulse Rings & Ambient Backlight -->
      <div class="rr-pulse-container">
        <div class="rr-ambient-glow"></div>
        <div class="rr-pulse-ring"></div>
        <div class="rr-pulse-ring"></div>
        <div class="rr-pulse-ring"></div>
      </div>

      <!-- Transparent Seamless Breathing Logo -->
      <div class="rr-logo-wrapper">
        <picture>
          <source srcset="splash/img/light-1x.png 1x, splash/img/light-2x.png 2x, splash/img/light-3x.png 3x, splash/img/light-4x.png 4x">
          <img class="rr-logo-img" aria-hidden="true" src="splash/img/light-1x.png" alt="RoadRobos Logo">
        </picture>
      </div>

      <!-- Sleek Loading Indicator & Tagline -->
      <div class="rr-status-area">
        <div class="rr-spin-ring"></div>
        <div class="rr-status-label">
          <span>Loading</span>
          <span class="rr-dots">
            <span>.</span><span>.</span><span>.</span>
          </span>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
