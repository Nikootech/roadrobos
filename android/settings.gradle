pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        def propertiesFile = new File(settingsDir, 'local.properties')
        if (propertiesFile.exists()) {
            propertiesFile.withReader('UTF-8') { reader ->
                properties.load(reader)
            }
        }
        def sdkPath = properties.getProperty('flutter.sdk')
        if (sdkPath == null || sdkPath.trim().isEmpty()) {
            sdkPath = System.getenv('FLUTTER_ROOT')
        }
        if (sdkPath == null || sdkPath.trim().isEmpty()) {
            sdkPath = 'E:/flutter'
        }
        return new File(sdkPath).toPath().normalize().toString().replace('\\', '/')
    }()
    settings.ext.flutterSdkPath = flutterSdkPath

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.9.1" apply false
    // START: FlutterFire Configuration
    id "com.google.gms.google-services" version "4.3.15" apply false
    id "com.google.firebase.crashlytics" version "2.8.1" apply false
    // END: FlutterFire Configuration
    id "org.jetbrains.kotlin.android" version "2.1.10" apply false
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.10.0'
}

rootProject.name = 'roadrobos_app_android'

include ":app"
